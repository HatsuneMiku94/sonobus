name: Add Windows autostart minimized-to-tray

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-windows-autostart.yml"
      - "tools/apply_windows_autostart_feature.py"

permissions:
  contents: write

jobs:
  implement-build-and-commit:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Steinberg ASIO SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:\msys64\usr\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw 'MSYS2 is not available on this runner.' }
          & $bash -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-asiosdk'
          if ($LASTEXITCODE -ne 0) { throw 'MSYS2 failed to install the ASIO SDK.' }
          $source = 'C:\msys64\mingw64\include\asiosdk'
          $destination = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'asiosdk'
          if (-not (Test-Path (Join-Path $source 'common\iasiodrv.h'))) { throw 'Installed ASIO SDK is incomplete.' }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force

      - name: Apply Windows autostart feature
        shell: pwsh
        run: python tools/apply_windows_autostart_feature.py

      - name: Validate source changes
        shell: pwsh
        run: |
          git diff --check
          $window = Get-Content Source/SonoStandaloneFilterWindow.h -Raw
          $app = Get-Content Source/SonoStandaloneFilterApp.cpp -Raw
          if ($window -notmatch 'Start with Windows \(minimized to tray\)') { throw 'Options toggle is missing.' }
          if ($window -notmatch 'WindowsRegistry::setValue') { throw 'Windows startup writer is missing.' }
          if ($window -notmatch 'WindowsRegistry::deleteValue') { throw 'Windows startup remover is missing.' }
          if ($app -notmatch '\-\-start-minimized') { throw 'Startup command-line option is missing.' }
          if ($app -notmatch 'startMinimizedToTray') { throw 'Startup visibility handling is missing.' }

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build SonoBus standalone
        shell: pwsh
        run: cmake --build build --config Release --target SonoBus_Standalone --parallel 2

      - name: Commit verified feature to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Source/SonoStandaloneFilterWindow.h Source/SonoStandaloneFilterApp.cpp README.md FORK_CHANGES.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Add Windows autostart minimized to tray"
          git push origin HEAD:main
