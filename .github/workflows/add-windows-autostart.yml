name: Add Windows autostart minimized-to-tray

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-windows-autostart.yml"

permissions:
  contents: write

jobs:
  implement-build-and-commit:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Steinberg ASIO SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:\msys64\usr\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw 'MSYS2 is not available on this runner.' }
          & $bash -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-asiosdk'
          if ($LASTEXITCODE -ne 0) { throw 'MSYS2 failed to install the ASIO SDK.' }
          $source = 'C:\msys64\mingw64\include\asiosdk'
          $destination = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'asiosdk'
          if (-not (Test-Path (Join-Path $source 'common\iasiodrv.h'))) { throw 'Installed ASIO SDK is incomplete.' }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force

      - name: Implement Windows startup support
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          window_path = Path('Source/SonoStandaloneFilterWindow.h')
          window = window_path.read_text(encoding='utf-8')

          marker = '''#if JUCE_WINDOWS
    void minimisationStateChanged (bool isNowMinimised) override
'''
          helpers = '''#if JUCE_WINDOWS
    static String getWindowsStartupRegistryPath()
    {
        return "HKEY_CURRENT_USER\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\SonoBus";
    }

    static String getWindowsStartupCommand()
    {
        const auto executablePath = File::getSpecialLocation (File::currentExecutableFile).getFullPathName();
        return "\\\"" + executablePath + "\\\" --start-minimized";
    }

    bool isStartWithWindowsEnabled() const
    {
        return WindowsRegistry::getValue (getWindowsStartupRegistryPath()).trim() == getWindowsStartupCommand();
    }

    bool setStartWithWindowsEnabled (bool shouldEnable)
    {
        const auto registryPath = getWindowsStartupRegistryPath();

        if (shouldEnable)
            return WindowsRegistry::setValue (registryPath, getWindowsStartupCommand());

        if (! WindowsRegistry::valueExists (registryPath))
            return true;

        return WindowsRegistry::deleteValue (registryPath);
    }

    void minimisationStateChanged (bool isNowMinimised) override
'''
          window = replace_once(window, marker, helpers, 'startup helper insertion')

          old_menu = '''        m.addSeparator();
        m.addItem (4, TRANS("Reset to default state"));

        m.showMenuAsync'''
          new_menu = '''        m.addSeparator();
        m.addItem (4, TRANS("Reset to default state"));
#if JUCE_WINDOWS
        m.addSeparator();
        m.addItem (5, TRANS("Start with Windows (minimized to tray)"), true, isStartWithWindowsEnabled());
#endif

        m.showMenuAsync'''
          window = replace_once(window, old_menu, new_menu, 'options menu insertion')

          old_switch = '''            case 3:  pluginHolder->askUserToLoadState(); break;
            case 4:  resetToDefaultState(); break;
            default: break;
'''
          new_switch = '''            case 3:  pluginHolder->askUserToLoadState(); break;
            case 4:  resetToDefaultState(); break;
#if JUCE_WINDOWS
            case 5:
            {
                const bool shouldEnable = ! isStartWithWindowsEnabled();
                if (! setStartWithWindowsEnabled (shouldEnable))
                {
                    AlertWindow::showMessageBoxAsync (AlertWindow::WarningIcon,
                                                      TRANS("Startup Setting"),
                                                      TRANS("SonoBus could not update the Windows startup setting."));
                }
                break;
            }
#endif
            default: break;
'''
          window = replace_once(window, old_switch, new_switch, 'menu handler insertion')
          window_path.write_text(window, encoding='utf-8', newline='\n')

          app_path = Path('Source/SonoStandaloneFilterApp.cpp')
          app = app_path.read_text(encoding='utf-8')

          old_flags = '''    bool doImmediateQuit = false;
    bool doHeadless = false;
    String loadSetupFilename;
'''
          new_flags = '''    bool doImmediateQuit = false;
    bool doHeadless = false;
#if JUCE_WINDOWS
    bool startMinimizedToTray = false;
#endif
    String loadSetupFilename;
'''
          app = replace_once(app, old_flags, new_flags, 'startup flag insertion')

          old_specs = '''        const String headlessSpec("-q|--headless");
        const String headlessSpecDesc("-q|--headless");

        const String loadSetupSpec("-l|--load-setup");
'''
          new_specs = '''        const String headlessSpec("-q|--headless");
        const String headlessSpecDesc("-q|--headless");

#if JUCE_WINDOWS
        const String startMinimizedSpec("--start-minimized");
#endif

        const String loadSetupSpec("-l|--load-setup");
'''
          app = replace_once(app, old_specs, new_specs, 'command spec insertion')

          old_commands = '''        app.addCommand ({ headlessSpec, headlessSpecDesc,
            TRANS("If specified, no GUI will be used and the application will be run headless."),
            TRANS("You'll need to use other command-line options to connect to a group... eventually there will be an OSC remote control interface."),
            nullptr
        });



        if (arglist.removeOptionIfFound(versionSpec))'''
          new_commands = '''        app.addCommand ({ headlessSpec, headlessSpecDesc,
            TRANS("If specified, no GUI will be used and the application will be run headless."),
            TRANS("You'll need to use other command-line options to connect to a group... eventually there will be an OSC remote control interface."),
            nullptr
        });

#if JUCE_WINDOWS
        app.addCommand ({ startMinimizedSpec, startMinimizedSpec,
            TRANS("Start SonoBus hidden in the Windows system tray."), {}, nullptr
        });
#endif


        if (arglist.removeOptionIfFound(versionSpec))'''
          app = replace_once(app, old_commands, new_commands, 'command registration insertion')

          old_parse = '''        auto setupfile = arglist.removeValueForOption(loadSetupSpec);
        if (setupfile.isNotEmpty()) {
            loadSetupFilename = setupfile;
        }


        if (arglist.removeOptionIfFound(headlessSpec)) {
'''
          new_parse = '''        auto setupfile = arglist.removeValueForOption(loadSetupSpec);
        if (setupfile.isNotEmpty()) {
            loadSetupFilename = setupfile;
        }

#if JUCE_WINDOWS
        if (arglist.removeOptionIfFound(startMinimizedSpec))
            startMinimizedToTray = true;
#endif

        if (arglist.removeOptionIfFound(headlessSpec)) {
'''
          app = replace_once(app, old_parse, new_parse, 'command parsing insertion')

          old_visible = '''            mainWindow->setVisible (true);

            Desktop::getInstance().setScreenSaverEnabled(false);'''
          new_visible = '''#if JUCE_WINDOWS
            if (startMinimizedToTray)
                mainWindow->setVisible (false);
            else
#endif
                mainWindow->setVisible (true);

            Desktop::getInstance().setScreenSaverEnabled(false);'''
          app = replace_once(app, old_visible, new_visible, 'startup visibility insertion')
          app_path.write_text(app, encoding='utf-8', newline='\n')

          changes_path = Path('FORK_CHANGES.md')
          changes = changes_path.read_text(encoding='utf-8')
          anchor = '''- The tray functionality is compiled directly into `SonoBus.exe`; no companion helper process is required.\n\n'''
          section = '''- The tray functionality is compiled directly into `SonoBus.exe`; no companion helper process is required.\n\n### Windows autostart minimized to tray\n\nAdded on **2026-08-17**.\n\n- Adds a **Start with Windows (minimized to tray)** toggle to the standalone app's Options menu.\n- Uses the current user's standard Windows startup registry entry (`HKEY_CURRENT_USER`), so enabling it does not require administrator privileges.\n- The startup entry points to the exact `SonoBus.exe` being used and passes the internal `--start-minimized` option.\n- At Windows sign-in, SonoBus initializes normally but keeps its main window hidden and remains available from the system tray.\n- Disabling the toggle removes the startup entry.\n\n'''
          changes = replace_once(changes, anchor, section, 'fork changes insertion')
          changes_path.write_text(changes, encoding='utf-8', newline='\n')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_note = '> **Fork note:** The Windows minimize-to-tray implementation is built directly into the standalone SonoBus source. No helper executable or tray patch step is required when compiling this fork. The Windows GitHub Actions build provisions SonoBus\'s existing ASIO SDK dependency automatically.'
          new_note = '> **Fork note:** Native Windows minimize-to-tray support and optional **Start with Windows (minimized to tray)** support are built directly into the standalone SonoBus source. No helper executable or tray patch step is required when compiling this fork. The Windows GitHub Actions build provisions SonoBus\'s existing ASIO SDK dependency automatically.'
          readme = replace_once(readme, old_note, new_note, 'README fork note update')
          readme_path.write_text(readme, encoding='utf-8', newline='\n')

      - name: Validate changes
        shell: pwsh
        run: |
          git diff --check
          $window = Get-Content Source/SonoStandaloneFilterWindow.h -Raw
          $app = Get-Content Source/SonoStandaloneFilterApp.cpp -Raw
          if ($window -notmatch 'Start with Windows \(minimized to tray\)') { throw 'Options toggle is missing.' }
          if ($window -notmatch 'WindowsRegistry::setValue') { throw 'Windows registry startup writer is missing.' }
          if ($window -notmatch 'WindowsRegistry::deleteValue') { throw 'Windows registry startup remover is missing.' }
          if ($app -notmatch '\-\-start-minimized') { throw 'Startup command-line option is missing.' }
          if ($app -notmatch 'startMinimizedToTray') { throw 'Startup visibility handling is missing.' }
          git status --short

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build SonoBus standalone
        shell: pwsh
        run: cmake --build build --config Release --target SonoBus_Standalone --parallel 2

      - name: Commit verified feature to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Source/SonoStandaloneFilterWindow.h Source/SonoStandaloneFilterApp.cpp README.md FORK_CHANGES.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Add Windows autostart minimized to tray"
          git push origin HEAD:main
