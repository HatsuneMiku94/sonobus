name: Materialize native tray integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-native-tray.yml"

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Steinberg ASIO SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:\msys64\usr\bin\bash.exe'
          if (-not (Test-Path $bash)) {
            throw 'MSYS2 is not available at C:\msys64 on this runner.'
          }

          & $bash -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-asiosdk'
          if ($LASTEXITCODE -ne 0) { throw 'MSYS2 failed to install the ASIO SDK.' }

          $source = 'C:\msys64\mingw64\include\asiosdk'
          $destination = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'asiosdk'
          if (-not (Test-Path (Join-Path $source 'common\iasiodrv.h'))) {
            throw 'Installed ASIO SDK does not contain common\iasiodrv.h.'
          }

          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force

      - name: Materialize tray code into source
        shell: pwsh
        run: python tools/apply_windows_tray_patch.py

      - name: Add fork build note
        shell: python
        run: |
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = 'Unofficial SonoBus fork featuring native Windows minimize-to-tray integration.\n\n'
          note = '''Unofficial SonoBus fork featuring native Windows minimize-to-tray integration.\n\n> **Fork note:** The Windows minimize-to-tray implementation is built directly into the standalone SonoBus source. No helper executable or tray patch step is required when compiling this fork. The Windows GitHub Actions build provisions SonoBus's existing ASIO SDK dependency automatically.\n\n'''
          if note not in text:
              if marker not in text:
                  raise SystemExit('README fork marker was not found.')
              text = text.replace(marker, note, 1)
              readme.write_text(text, encoding='utf-8', newline='\n')

      - name: Remove obsolete patcher
        shell: pwsh
        run: Remove-Item tools/apply_windows_tray_patch.py -Force

      - name: Validate repository changes
        shell: pwsh
        run: |
          git diff --check
          $source = Get-Content Source/SonoStandaloneFilterWindow.h -Raw
          if ($source -notmatch 'class SonoBusSystemTrayIcon final') { throw 'Tray code was not materialized.' }
          if ($source -notmatch 'minimisationStateChanged') { throw 'Minimize-to-tray handler is missing.' }
          if (Test-Path tools/apply_windows_tray_patch.py) { throw 'Obsolete patcher still exists.' }
          git status --short

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build native tray standalone
        shell: pwsh
        run: cmake --build build --config Release --target SonoBus_Standalone --parallel 2

      - name: Commit materialized source to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Source/SonoStandaloneFilterWindow.h README.md
          git rm -- tools/apply_windows_tray_patch.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Make native Windows tray integration part of source"
          git push origin HEAD:main
